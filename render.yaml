# Render Blueprint — one-click free deployment.
#
# Render reads this file when you point a new Blueprint at the repository.
# It creates the API and the static frontend. Postgres and Redis are NOT
# created here on purpose: Render's free Postgres expires 30 days after
# creation, which loses family data. Point DATABASE_URL at Neon and
# REDIS_URL at Upstash instead — both have permanent free tiers.
# See docs/DEPLOY_FREE.md.
services:
  # ---------------------------------------------------------------------------
  # Django API. Free plan: 512 MB RAM, spins down after 15 minutes idle and
  # takes about a minute to wake. 750 instance hours per month.
  # ---------------------------------------------------------------------------
  - type: web
    name: familynexus-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
    startCommand: bash ../scripts/release.sh
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Generated once by Render and kept secret afterwards.
      - key: SECRET_KEY
        generateValue: true
      # Fernet key for provider credentials stored in the database.
      # Generate locally: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Paste the pooled connection string from Neon, ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Paste the rediss:// URL from Upstash
      - key: REDIS_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Object storage for uploaded documents and avatars. Without these the
      # free instance's disk is wiped on every deploy. See docs/DEPLOY_FREE.md.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: EMAIL_PROVIDER
        value: console
      - key: SENTRY_DSN
        sync: false

  # ---------------------------------------------------------------------------
  # React SPA. Static sites are free, never sleep, and get free TLS.
  # VITE_API_BASE_URL must be the API's public URL followed by /api/v1.
  # ---------------------------------------------------------------------------
  - type: web
    name: familynexus-web
    runtime: static
    rootDir: frontend
    buildCommand: |
      npm ci
      npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        value: https://us.i.posthog.com
    routes:
      # Client-side routing: every unknown path must return index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-store, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
