# Serves the built SPA in production. The API is reached through the same
# origin (/api is proxied to Django by the edge nginx), so connect-src 'self'
# is enough for normal API traffic.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed build assets are immutable; the HTML shell must never be cached or
    # a deploy would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The service worker must be revalidated on every load, otherwise a stale
    # worker can pin an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;

        # The SPA is a static bundle: no inline scripts, no eval, and no
        # third-party origin except PostHog. If VITE_POSTHOG_HOST is changed to
        # a self-hosted instance, add that origin to connect-src here too.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://us.i.posthog.com https://*.i.posthog.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        # HSTS is set here as well as on Django so it also covers the HTML shell.
        # Only enable once the site is known-good on HTTPS; browsers cache it
        # for a year. max-age is deliberately short in this comment block so a
        # misconfiguration is recoverable. Raise it after verifying.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
